<script src="js/theme.js"></script>
<script src="js/gate.js"></script>
<link rel="stylesheet" href="css/style.css">

<body>
<header class="site">
  <a class="brand" href="index.html">LabVirtyèl <span>Ayiti</span></a>
  <nav>
    <a href="index.html" data-fr="Accueil" data-ht="Akèy">Accueil</a>
    <a href="simulations.html" data-fr="Simulations" data-ht="Simulasyon">Simulations</a>
    <a href="bibliotheque.html" data-fr="Bibliothèque" data-ht="Bibliyotèk">Bibliothèque</a>
    <a href="bibliotheque.html?tab=parcours" data-fr="Parcours" data-ht="Pakou">Parcours</a>
    <a href="etudiant.html" data-fr="Ma classe" data-ht="Klas mwen">Ma classe</a>
    <a href="enseignant.html" data-fr="Espace enseignant" data-ht="Espas pwofesè">Espace enseignant</a>
  </nav>
  <div class="lang-switch"><button data-lang="fr">Français</button><button data-lang="ht">Kreyòl</button></div>
</header>

<main>
  <div class="section-head" style="margin-top:0">
    <h1 style="margin:0" data-fr="Administration" data-ht="Administrasyon">Administration</h1>
    <button class="btn" id="reload" data-fr="Actualiser" data-ht="Rafrechi">Actualiser</button>
  </div>
  <p class="subtitle" id="asof"></p>
  <div id="page"><div class="empty" data-fr="Chargement…" data-ht="Ap chaje…">Chargement…</div></div>
</main>

<footer class="site">
  <span data-fr="Accès réservé aux administrateurs. Chaque action est vérifiée par le serveur." data-ht="Se pou administratè sèlman. Sèvè a verifye chak aksyon.">Accès réservé aux administrateurs. Chaque action est vérifiée par le serveur.</span>
  <span class="org" data-fr="Un projet DUVTECH · © 2026 DUVTECH" data-ht="Yon pwojè DUVTECH · © 2026 DUVTECH">Un projet DUVTECH · © 2026 DUVTECH</span>
</footer>
<script src="js/vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/community.js"></script>
<script>
(function () {
  var D = APP.D, esc = APP.esc, sb = AUTH.client;
  var page = document.getElementById('page');
  var me = null, people = [], prog = [], res = [], tab = 'participants', loadedAt = null, error = null;
  var f = { q: '', role: '', status: '', info: '' }, openId = null;

  /* Informations personnelles (mêmes règles que l'inscription) */
  var NOM_OK = /^\p{L}+(?:[ '’-]\p{L}+)*$/u, PAS_LETTRE = /[^\p{L} '’-]/gu;
  var INFO = ['last_name', 'first_name', 'sex', 'birth_date', 'address', 'phone'];
  var SEX = { F: ['Féminin', 'Fi'], M: ['Masculin', 'Gason'] };
  function check(key, v) {
    if (key === 'school') return '';
    if (!v) return LV.t('Obligatoire', 'Obligatwa');
    if (key === 'last_name' || key === 'first_name') return v.length >= 2 && NOM_OK.test(v) ? '' : LV.t('Lettres seulement (2 au moins)', 'Lèt sèlman (omwen 2)');
    if (key === 'sex') return v === 'F' || v === 'M' ? '' : LV.t('Obligatoire', 'Obligatwa');
    if (key === 'birth_date') { var a = age(v); return /^\d{4}-\d{2}-\d{2}$/.test(v) && a >= 5 && a <= 120 ? '' : LV.t('Date non valable', 'Dat la pa bon'); }
    if (key === 'address') return v.length >= 5 ? '' : LV.t('Adresse trop courte', 'Adrès la twò kout');
    if (key === 'phone') return /^[0-9]{8,15}$/.test(v) ? '' : LV.t('8 à 15 chiffres', '8 a 15 chif');
    return '';
  }
  function age(d) { return d ? Math.floor((Date.now() - new Date(d + 'T00:00:00').getTime()) / 31557600000) : null; }
  function incomplete(p) { return INFO.some(function (k) { return check(k, p[k] || ''); }); }
  function displayName(p) { return p.last_name || p.first_name ? ((p.last_name || '').toUpperCase() + ' ' + (p.first_name || '')).trim() : (p.full_name || '—'); }
  function birth(p) { return p.birth_date ? new Date(p.birth_date + 'T00:00:00').toLocaleDateString('fr-FR') + ' (' + age(p.birth_date) + ' ' + LV.t('ans', 'an') + ')' : '—'; }
  var PT = { eleve: ['Élève', 'Elèv'], etudiant: ['Étudiant', 'Etidyan'], enseignant: ['Enseignant', 'Pwofesè'], formateur: ['Formateur', 'Fòmatè'], public: ['Grand public', 'Piblik'] };
  var ROLE = { apprenant: ['Apprenant', 'Aprann'], enseignant: ['Enseignant', 'Pwofesè'], admin: ['Administrateur', 'Administratè'] };
  function t2(a) { return LV.t(a[0], a[1]); }
  var DAY = 86400000;

  async function load() {
    error = null;
    var a = await Promise.all([
      sb.from('profiles').select('*').order('created_at', { ascending: false }),
      sb.from('progress').select('user_id,resource_id,score,total,done_at'),
      sb.from('community_resources').select('*').order('created_at', { ascending: false })
    ]);
    var bad = a.filter(function (x) { return x.error; })[0];
    if (bad) { error = bad.error.message; return; }
    people = a[0].data; prog = a[1].data; res = a[2].data; loadedAt = new Date();
  }

  function stats(uid) {
    var rows = prog.filter(function (x) { return x.user_id === uid; });
    var q = rows.filter(function (x) { return x.total; });
    var avg = q.length ? Math.round(q.reduce(function (s, x) { return s + x.score / x.total; }, 0) / q.length * 100) : null;
    return { done: rows.length, avg: avg };
  }

  function kpis() {
    var now = Date.now();
    var active7 = people.filter(function (p) { return p.last_seen && now - Date.parse(p.last_seen) < 7 * DAY; }).length;
    var list = [
      [people.length, LV.t('Participants inscrits', 'Patisipan enskri')],
      [people.filter(function (p) { return p.email_confirmed_at; }).length, LV.t('Comptes confirmés', 'Kont konfime')],
      [active7, LV.t('Actifs sur 7 jours', 'Aktif nan 7 jou')],
      [people.filter(function (p) { return p.role === 'enseignant'; }).length, LV.t('Enseignants validés', 'Pwofesè valide')],
      [people.filter(function (p) { return p.teacher_status === 'en_attente'; }).length, LV.t('Demandes enseignant', 'Demann pwofesè'), 'demandes'],
      [people.filter(incomplete).length, LV.t('Profils incomplets', 'Pwofil ki pa konplè'), 'incomplets'],
      [res.filter(function (r) { return r.status === 'en_attente'; }).length, LV.t('Ressources à valider', 'Resous pou valide'), 'validation']
    ];
    return '<div class="kpis admin-kpis">' + list.map(function (k) {
      return '<div class="kpi' + (k[2] && k[0] ? ' alert-kpi' : '') + '"' + (k[2] ? ' data-go="' + k[2] + '"' : '') + '><b>' + k[0] + '</b><span>' + k[1] + '</span></div>';
    }).join('') + '</div>';
  }

  /* Inscriptions par semaine (8 dernières semaines) */
  function chart() {
    var weeks = [], now = new Date(); now.setHours(0, 0, 0, 0);
    var start = new Date(now.getTime() - ((now.getDay() + 6) % 7) * DAY);
    for (var i = 7; i >= 0; i--) {
      var a = start.getTime() - i * 7 * DAY, b = a + 7 * DAY;
      weeks.push({ a: a, n: people.filter(function (p) { var t = Date.parse(p.created_at); return t >= a && t < b; }).length });
    }
    var max = Math.max(1, Math.max.apply(null, weeks.map(function (w) { return w.n; })));
    return '<div class="panel"><h2>' + LV.t('Inscriptions par semaine', 'Enskripsyon pa semèn') + '</h2><div class="bars">' + weeks.map(function (w) {
      return '<div class="bar"><span class="v">' + w.n + '</span><i style="height:' + Math.round(w.n / max * 100) + '%"></i><small>' +
        new Date(w.a).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + '</small></div>';
    }).join('') + '</div></div>';
  }

  function tabs() {
    var nReq = people.filter(function (p) { return p.teacher_status === 'en_attente'; }).length;
    var nVal = res.filter(function (r) { return r.status === 'en_attente'; }).length;
    var list = [['participants', LV.t('Participants', 'Patisipan')], ['demandes', LV.t('Demandes enseignant', 'Demann pwofesè') + (nReq ? ' (' + nReq + ')' : '')],
      ['validation', LV.t('Ressources à valider', 'Resous pou valide') + (nVal ? ' (' + nVal + ')' : '')], ['ressources', LV.t('Toutes les ressources', 'Tout resous yo')]];
    return '<div class="tabs admin-tabs">' + list.map(function (x) { return '<button data-tab="' + x[0] + '" class="' + (tab === x[0] ? 'active' : '') + '">' + x[1] + '</button>'; }).join('') + '</div>';
  }

  function participants() {
    var q = f.q.toLowerCase();
    var rows = people.filter(function (p) {
      var hay = [p.full_name, p.last_name, p.first_name, p.email, p.school, p.phone, p.address].join(' ').toLowerCase();
      return (!q || hay.indexOf(q) >= 0) && (!f.role || p.role === f.role) && (!f.status || p.status === f.status) &&
        (!f.info || (f.info === 'incomplet' ? incomplete(p) : !incomplete(p)));
    });
    return '<div class="panel"><div class="lib-top">' +
      '<input type="search" id="fq" placeholder="' + esc(LV.t('Nom, e-mail, téléphone, adresse…', 'Non, imèl, telefòn, adrès…')) + '" value="' + esc(f.q) + '">' +
      '<select id="frole"><option value="">' + LV.t('Tous les rôles', 'Tout wòl yo') + '</option>' + Object.keys(ROLE).map(function (k) { return '<option value="' + k + '"' + (f.role === k ? ' selected' : '') + '>' + t2(ROLE[k]) + '</option>'; }).join('') + '</select>' +
      '<select id="fstatus"><option value="">' + LV.t('Tous les statuts', 'Tout estati yo') + '</option><option value="actif"' + (f.status === 'actif' ? ' selected' : '') + '>' + LV.t('Actif', 'Aktif') + '</option><option value="suspendu"' + (f.status === 'suspendu' ? ' selected' : '') + '>' + LV.t('Suspendu', 'Sispann') + '</option></select>' +
      '<select id="finfo"><option value="">' + LV.t('Toutes les fiches', 'Tout fich yo') + '</option><option value="incomplet"' + (f.info === 'incomplet' ? ' selected' : '') + '>' + LV.t('Informations incomplètes', 'Enfòmasyon pa konplè') + '</option><option value="complet"' + (f.info === 'complet' ? ' selected' : '') + '>' + LV.t('Informations complètes', 'Enfòmasyon konplè') + '</option></select>' +
      '<button class="btn" id="csv">' + LV.t('Exporter (CSV)', 'Ekspòte (CSV)') + '</button></div>' +
      '<div class="count">' + rows.length + ' ' + LV.t('participant(s)', 'patisipan') + '</div>' +
      '<div class="table-wrap"><table class="matrix admin-table"><thead><tr>' +
      [LV.t('Participant', 'Patisipan'), LV.t('Profil', 'Pwofil'), LV.t('Rôle', 'Wòl'), LV.t('Statut', 'Estati'), LV.t('Inscription', 'Enskripsyon'),
       LV.t('Dernière activité', 'Dènye aktivite'), LV.t('Terminées', 'Fini'), LV.t('Quiz', 'Quiz')].map(function (h) { return '<th>' + h + '</th>'; }).join('') +
      '</tr></thead><tbody>' + rows.map(function (p) {
        var s = stats(p.id), self = p.id === me.id;
        return '<tr data-id="' + p.id + '"' + (openId === p.id ? ' class="open"' : '') + '><td><b>' + esc(displayName(p)) + '</b><small>' + esc(p.email) + (p.phone ? ' · ' + esc(p.phone) : '') + '</small>' +
          '<small>' + (p.sex ? t2(SEX[p.sex]) : '') + (p.birth_date ? (p.sex ? ' · ' : '') + age(p.birth_date) + ' ' + LV.t('ans', 'an') : '') + (p.school ? ' · ' + esc(p.school) : '') + '</small>' +
          (p.email_confirmed_at ? '' : '<small class="st warn">' + LV.t('E-mail non confirmé', 'Imèl pa konfime') + '</small>') +
          (incomplete(p) ? '<small class="st warn">' + LV.t('Informations incomplètes', 'Enfòmasyon pa konplè') + '</small>' : '') +
          '<button class="btn small" data-details aria-expanded="' + (openId === p.id) + '">' + (openId === p.id ? LV.t('Fermer la fiche', 'Fèmen fich la') : LV.t('Voir la fiche', 'Wè fich la')) + '</button></td>' +
          '<td>' + t2(PT[p.profile_type] || PT.public) + '</td>' +
          '<td><select data-role' + (self ? ' disabled title="' + esc(LV.t('Vous ne pouvez pas changer votre propre rôle', 'Ou pa ka chanje pwòp wòl ou')) + '"' : '') + '>' + Object.keys(ROLE).map(function (k) {
            return '<option value="' + k + '"' + (p.role === k ? ' selected' : '') + '>' + t2(ROLE[k]) + '</option>'; }).join('') + '</select></td>' +
          '<td><span class="st ' + (p.status === 'actif' ? 'good' : 'bad') + '">' + (p.status === 'actif' ? LV.t('Actif', 'Aktif') : LV.t('Suspendu', 'Sispann')) + '</span>' +
          (self ? '' : '<button class="btn small" data-toggle>' + (p.status === 'actif' ? LV.t('Suspendre', 'Sispann') : LV.t('Réactiver', 'Reaktive')) + '</button>') + '</td>' +
          '<td>' + COMM.date(p.created_at) + '</td><td>' + COMM.date(p.last_seen) + '</td>' +
          '<td>' + s.done + '</td><td>' + (s.avg == null ? '—' : s.avg + ' %') + '</td></tr>' +
          (openId === p.id ? '<tr class="fiche-row"><td colspan="8">' + fiche(p, s) + '</td></tr>' : '');
      }).join('') + '</tbody></table></div></div>';
  }

  /* Fiche complète d'un participant, modifiable par l'administrateur */
  function fiche(p, s) {
    function inp(id, key, label, attrs) {
      return '<label class="fld"><span>' + label + '</span><input id="' + id + '" data-k="' + key + '" value="' + esc(p[key] || '') + '" ' + attrs + '><small class="err"></small></label>';
    }
    return '<div class="fiche" data-fiche="' + p.id + '">' +
      '<div class="fiche-grid">' +
        '<div><h3>' + LV.t('Identité et coordonnées', 'Idantite ak kowòdone') + '</h3>' +
          '<div class="fld-row">' + inp('a-ln', 'last_name', LV.t('Nom', 'Non'), 'type="text" maxlength="60" data-filtre="lettres"') +
            inp('a-fn', 'first_name', LV.t('Prénom', 'Prenon'), 'type="text" maxlength="60" data-filtre="lettres"') + '</div>' +
          '<div class="fld-row"><label class="fld"><span>' + LV.t('Sexe', 'Sèks') + '</span><select data-k="sex"><option value="">—</option>' +
            Object.keys(SEX).map(function (k) { return '<option value="' + k + '"' + (p.sex === k ? ' selected' : '') + '>' + t2(SEX[k]) + '</option>'; }).join('') + '</select><small class="err"></small></label>' +
            inp('a-bd', 'birth_date', LV.t('Date de naissance', 'Dat nesans'), 'type="date" min="1900-01-01" max="' + new Date().toISOString().slice(0, 10) + '"') + '</div>' +
          inp('a-ad', 'address', LV.t('Adresse', 'Adrès'), 'type="text" maxlength="200"') +
          '<div class="fld-row">' + inp('a-ph', 'phone', LV.t('Téléphone', 'Telefòn'), 'type="tel" maxlength="15" inputmode="numeric" data-filtre="chiffres"') +
            inp('a-sc', 'school', LV.t('Établissement', 'Lekòl'), 'type="text" maxlength="160"') + '</div>' +
          '<div class="btn-row"><button class="btn primary" data-save>' + LV.t('Enregistrer les modifications', 'Anrejistre chanjman yo') + '</button>' +
            '<span class="muted" data-saved></span></div>' +
        '</div>' +
        '<div><h3>' + LV.t('Compte et activité', 'Kont ak aktivite') + '</h3><dl class="fiche-dl">' +
          [[LV.t('E-mail', 'Imèl'), '<a href="mailto:' + esc(p.email) + '">' + esc(p.email) + '</a>' + (p.email_confirmed_at ? ' <span class="st good">' + LV.t('confirmé', 'konfime') + '</span>' : ' <span class="st warn">' + LV.t('non confirmé', 'pa konfime') + '</span>')],
           [LV.t('Téléphone', 'Telefòn'), p.phone ? '<a href="tel:+' + esc(p.phone) + '">' + esc(p.phone) + '</a>' : '—'],
           [LV.t('Date de naissance', 'Dat nesans'), birth(p)],
           [LV.t('Profil', 'Pwofil'), t2(PT[p.profile_type] || PT.public)],
           [LV.t('Rôle', 'Wòl'), t2(ROLE[p.role] || ROLE.apprenant)],
           [LV.t('Demande enseignant', 'Demann pwofesè'), ({ aucun: '—', en_attente: LV.t('en attente', 'ap tann'), approuve: LV.t('validée', 'valide'), refuse: LV.t('refusée', 'refize') })[p.teacher_status] || '—'],
           [LV.t('Statut', 'Estati'), p.status === 'actif' ? LV.t('Actif', 'Aktif') : LV.t('Suspendu', 'Sispann')],
           [LV.t('Inscription', 'Enskripsyon'), COMM.date(p.created_at)],
           [LV.t('Dernière activité', 'Dènye aktivite'), COMM.date(p.last_seen)],
           [LV.t('Ressources terminées', 'Resous fini'), s.done + ' / ' + D.resources.length],
           [LV.t('Moyenne aux quiz', 'Mwayèn quiz'), s.avg == null ? '—' : s.avg + ' %']].map(function (x) { return '<dt>' + x[0] + '</dt><dd>' + x[1] + '</dd>'; }).join('') +
        '</dl></div>' +
      '</div></div>';
  }

  function demandes() {
    var rows = people.filter(function (p) { return p.teacher_status === 'en_attente'; });
    return '<div class="panel">' + (rows.length ? '<div class="cres-list">' + rows.map(function (p) {
      return '<article class="cres" data-id="' + p.id + '"><h3>' + esc(displayName(p)) + '</h3><p class="muted">' + esc(p.email) + (p.phone ? ' · ' + esc(p.phone) : '') + ' · ' + t2(PT[p.profile_type] || PT.public) +
        (p.school ? ' · ' + esc(p.school) : '') + '</p><p class="by">' + LV.t('Inscrit le ', 'Enskri ') + COMM.date(p.created_at) +
        (p.email_confirmed_at ? '' : ' · <span class="st warn">' + LV.t('E-mail non confirmé', 'Imèl pa konfime') + '</span>') + '</p>' +
        '<div class="btn-row"><button class="btn primary" data-approve>' + LV.t('Valider comme enseignant', 'Valide kòm pwofesè') + '</button>' +
        '<button class="btn" data-refuse>' + LV.t('Refuser', 'Refize') + '</button></div></article>';
    }).join('') + '</div>' : '<div class="empty">' + LV.t('Aucune demande en attente.', 'Pa gen demann k ap tann.') + '</div>') + '</div>';
  }

  function resources(onlyPending) {
    var rows = res.filter(function (r) { return !onlyPending || r.status === 'en_attente'; });
    return '<div class="panel">' + (rows.length ? '<div class="cres-list">' + rows.map(function (r) {
      var acts = (r.status !== 'publie' ? '<button class="btn primary" data-publish>' + LV.t('Publier', 'Pibliye') + '</button>' : '<button class="btn" data-unpublish>' + LV.t('Retirer', 'Retire') + '</button>') +
        (r.status !== 'refuse' ? '<button class="btn" data-reject>' + LV.t('Refuser', 'Refize') + '</button>' : '') +
        '<button class="btn danger" data-delete>' + LV.t('Supprimer', 'Efase') + '</button>' +
        '<input class="note-in" maxlength="500" placeholder="' + esc(LV.t('Motif du refus (visible par l\'auteur)', 'Rezon refi a (otè a ap wè l)')) + '">';
      return COMM.card(r, { status: true, author: r.author_name, actions: acts });
    }).join('') + '</div>' : '<div class="empty">' + (onlyPending ? LV.t('Rien à valider pour le moment.', 'Pa gen anyen pou valide kounye a.') : LV.t('Aucune ressource.', 'Pa gen resous.')) + '</div>') + '</div>';
  }

  function render() {
    if (error) { page.innerHTML = '<div class="empty">' + LV.t('Erreur de chargement : ', 'Erè chajman : ') + esc(error) + '</div>'; return; }
    if (!me) return;
    document.getElementById('asof').textContent = loadedAt ? LV.t('Données du ', 'Done ') + loadedAt.toLocaleString('fr-FR') : '';
    var body = tab === 'participants' ? participants() : tab === 'demandes' ? demandes() : tab === 'validation' ? resources(true) : resources(false);
    page.innerHTML = kpis() + chart() + tabs() + body;
    bind();
  }

  async function act(promise, btn) {
    if (btn) btn.disabled = true;
    var r = await promise;
    if (r.error) { alertBox(r.error.message); if (btn) btn.disabled = false; return false; }
    await load(); render(); return true;
  }
  function alertBox(m) {
    var d = document.createElement('div'); d.className = 'alert danger show'; d.textContent = LV.t('Action refusée : ', 'Aksyon refize : ') + m;
    page.prepend(d);
  }

  function bind() {
    page.querySelectorAll('[data-go]').forEach(function (k) { k.addEventListener('click', function () {
      var g = k.getAttribute('data-go');
      if (g === 'incomplets') { tab = 'participants'; f.info = 'incomplet'; } else tab = g;
      render();
    }); });
    page.querySelectorAll('.admin-tabs button').forEach(function (b) { b.addEventListener('click', function () { tab = b.getAttribute('data-tab'); render(); }); });
    var fq = document.getElementById('fq');
    if (fq) {
      fq.addEventListener('input', function () { f.q = fq.value; var pos = fq.selectionStart; render(); var n = document.getElementById('fq'); n.focus(); n.setSelectionRange(pos, pos); });
      document.getElementById('frole').addEventListener('change', function (e) { f.role = e.target.value; render(); });
      document.getElementById('fstatus').addEventListener('change', function (e) { f.status = e.target.value; render(); });
      document.getElementById('finfo').addEventListener('change', function (e) { f.info = e.target.value; render(); });
      document.getElementById('csv').addEventListener('click', csv);
    }
    page.querySelectorAll('tr[data-id]').forEach(function (tr) {
      var id = tr.getAttribute('data-id'), p = people.filter(function (x) { return x.id === id; })[0];
      tr.querySelector('[data-details]').addEventListener('click', function () { openId = openId === id ? null : id; render(); });
      var sel = tr.querySelector('[data-role]');
      sel.addEventListener('change', function () {
        var role = sel.value, upd = { role: role };
        if (role !== 'apprenant') upd.teacher_status = 'approuve';
        act(sb.from('profiles').update(upd).eq('id', id), sel);
      });
      var tg = tr.querySelector('[data-toggle]');
      if (tg) tg.addEventListener('click', function () {
        if (p.status === 'actif' && tg.getAttribute('data-sure') !== '1') { tg.setAttribute('data-sure', '1'); tg.textContent = LV.t('Confirmer', 'Konfime'); return; }
        act(sb.from('profiles').update({ status: p.status === 'actif' ? 'suspendu' : 'actif' }).eq('id', id), tg);
      });
    });
    page.querySelectorAll('[data-fiche]').forEach(function (box) {
      var id = box.getAttribute('data-fiche');
      box.querySelectorAll('[data-filtre]').forEach(function (el) {
        el.addEventListener('input', function () {
          var v = el.value, c = el.getAttribute('data-filtre') === 'chiffres' ? v.replace(/[^0-9]/g, '') : v.replace(PAS_LETTRE, '');
          if (c !== v) { var pos = el.selectionStart - (v.length - c.length); el.value = c; try { el.setSelectionRange(pos, pos); } catch (e) {} }
        });
      });
      box.querySelector('[data-save]').addEventListener('click', function () {
        var upd = {}, ok = true;
        box.querySelectorAll('[data-k]').forEach(function (el) {
          var k = el.getAttribute('data-k'), v = el.value.trim(), m = check(k, v);
          var err = el.parentNode.querySelector('.err'); if (err) err.textContent = m;
          el.setAttribute('aria-invalid', m ? 'true' : 'false');
          if (m) ok = false; else upd[k] = k === 'birth_date' && !v ? null : v;
        });
        if (!ok) { box.querySelector('[data-saved]').textContent = LV.t('Corrigez les champs en rouge.', 'Korije chan ki an wouj yo.'); return; }
        upd.full_name = upd.first_name + ' ' + upd.last_name;
        act(sb.from('profiles').update(upd).eq('id', id), this);
      });
    });
    page.querySelectorAll('[data-approve], [data-refuse]').forEach(function (b) {
      b.addEventListener('click', function () {
        var id = b.closest('[data-id]').getAttribute('data-id');
        var upd = b.hasAttribute('data-approve') ? { role: 'enseignant', teacher_status: 'approuve' } : { teacher_status: 'refuse' };
        act(sb.from('profiles').update(upd).eq('id', id), b);
      });
    });
    page.querySelectorAll('.cres[data-id]').forEach(function (el) {
      var r = res.filter(function (x) { return x.id === el.getAttribute('data-id'); })[0];
      if (!r) return;
      el.querySelector('[data-open]').addEventListener('click', function () { COMM.open(r, el); });
      var note = function () { var n = el.querySelector('.note-in'); return n ? n.value.trim() : ''; };
      var on = function (sel, fn) { var b = el.querySelector(sel); if (b) b.addEventListener('click', function () { fn(b); }); };
      on('[data-publish]', function (b) { act(sb.from('community_resources').update({ status: 'publie', review_note: '' }).eq('id', r.id), b); });
      on('[data-unpublish]', function (b) { act(sb.from('community_resources').update({ status: 'en_attente' }).eq('id', r.id), b); });
      on('[data-reject]', function (b) {
        if (!note()) { el.querySelector('.note-in').focus(); el.querySelector('.note-in').classList.add('need'); return; }
        act(sb.from('community_resources').update({ status: 'refuse', review_note: note() }).eq('id', r.id), b);
      });
      on('[data-delete]', async function (b) {
        if (b.getAttribute('data-sure') !== '1') { b.setAttribute('data-sure', '1'); b.textContent = LV.t('Confirmer la suppression', 'Konfime efase'); return; }
        if (r.file_path) await sb.storage.from('ressources').remove([r.file_path]);
        act(sb.from('community_resources').delete().eq('id', r.id), b);
      });
    });
  }

  function csv() {
    var head = ['Nom', 'Prénom', 'Nom complet', 'Sexe', 'Date de naissance', 'Adresse', 'Téléphone', 'E-mail', 'Établissement', 'Profil', 'Rôle', 'Statut', 'E-mail confirmé', 'Inscription', 'Dernière activité', 'Ressources terminées', 'Moyenne quiz (%)'];
    var cell = function (v) { v = v == null ? '' : String(v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
    var lines = [head.map(cell).join(';')].concat(people.map(function (p) {
      var s = stats(p.id);
      return [p.last_name || '', p.first_name || '', p.full_name, p.sex || '', p.birth_date || '', p.address || '', p.phone || '', p.email, p.school, (PT[p.profile_type] || PT.public)[0], ROLE[p.role][0], p.status, p.email_confirmed_at ? 'oui' : 'non',
        (p.created_at || '').slice(0, 10), (p.last_seen || '').slice(0, 10), s.done, s.avg == null ? '' : s.avg].map(cell).join(';');
    }));
    var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'participants-labvirtyel-' + new Date().toISOString().slice(0, 10) + '.csv'; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  document.getElementById('reload').addEventListener('click', async function () { await load(); render(); });
  LV.onLang(render);
  AUTH.ready.then(async function (p) {
    if (!AUTH.isAdmin(p)) {
      page.innerHTML = '<div class="empty">' + LV.t('Cette page est réservée aux administrateurs.', 'Paj sa a se pou administratè sèlman.') + ' <a href="index.html">' + LV.t('Retour à l\'accueil', 'Retounen nan akèy') + '</a></div>';
      return;
    }
    me = p; await load(); render();
  });
})();
</script>
