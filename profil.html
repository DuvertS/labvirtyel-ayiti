<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon profil · LabVirtyèl Ayiti</title>
<script src="js/theme.js"></script>
<script src="js/gate.js"></script>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="author" content="DUVTECH">
<meta name="theme-color" content="#1f3f7a">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="site">
  <a class="brand" href="index.html">LabVirtyèl <span>Ayiti</span></a>
  <nav>
    <a href="index.html" data-fr="Accueil" data-ht="Akèy">Accueil</a>
    <a href="simulations.html" data-fr="Simulations" data-ht="Simulasyon">Simulations</a>
    <a href="bibliotheque.html" data-fr="Bibliothèque" data-ht="Bibliyotèk">Bibliothèque</a>
    <a href="bibliotheque.html?tab=parcours" data-fr="Parcours" data-ht="Pakou">Parcours</a>
    <a href="etudiant.html" data-fr="Ma classe" data-ht="Klas mwen">Ma classe</a>
    <a href="enseignant.html" data-fr="Espace enseignant" data-ht="Espas pwofesè">Espace enseignant</a>
  </nav>
  <div class="lang-switch"><button data-lang="fr">Français</button><button data-lang="ht">Kreyòl</button></div>
</header>

<main id="page"></main>

<footer class="site">
  <span data-fr="Vos informations et réglages restent sur cet appareil." data-ht="Enfòmasyon ak reglaj ou yo rete sou aparèy sa a.">Vos informations et réglages restent sur cet appareil.</span>
  <span class="org" data-fr="Un projet DUVTECH · © 2026 DUVTECH" data-ht="Yon pwojè DUVTECH · © 2026 DUVTECH">Un projet DUVTECH · © 2026 DUVTECH</span>
</footer>
<script src="js/vendor/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
(function () {
  var D = APP.D, esc = APP.esc;
  var page = document.getElementById('page');

  function profile() { try { return JSON.parse(localStorage.getItem('lv-profile')) || {}; } catch (e) { return {}; } }
  function saveProfile(p) { try { localStorage.setItem('lv-profile', JSON.stringify(p)); } catch (e) { /* rien */ } }

  var PALETTES = [
    { id: 'classique', fr: 'Classique', ht: 'Klasik', dfr: 'Blanc, bleu, brique', dht: 'Blan, ble, brik' },
    { id: 'haiti', fr: 'Haïti', ht: 'Ayiti', dfr: 'Bleu et rouge du drapeau', dht: 'Ble ak wouj drapo a' },
    { id: 'sobre', fr: 'Sobre', ht: 'Senp', dfr: 'Gris anthracite, discret', dht: 'Gri fonse, dous' },
    { id: 'contraste', fr: 'Contraste élevé', ht: 'Gwo kontras', dfr: 'Lisibilité maximale', dht: 'Pi fasil pou li' }
  ];
  var ROLES = [
    ['eleve', 'Élève (école classique)', 'Elèv (lekòl klasik)'], ['etudiant', 'Étudiant(e)', 'Etidyan'], ['enseignant', 'Enseignant(e)', 'Pwofesè'],
    ['formateur', 'Formateur / formatrice', 'Fòmatè'], ['public', 'Grand public', 'Piblik']
  ];

  function seg(id, items, current) {
    return '<div class="seg" id="' + id + '">' + items.map(function (it) {
      return '<button type="button" data-v="' + it[0] + '" class="' + (it[0] === current ? 'on' : '') + '">' + it[1] + '</button>';
    }).join('') + '</div>';
  }

  /* Informations personnelles : mêmes règles que le formulaire d'inscription (compte.html) */
  var NOM_OK = /^\p{L}+(?:[ '’-]\p{L}+)*$/u, PAS_LETTRE = /[^\p{L} '’-]/gu;
  var FIELDS = { plast: 'last_name', pfirst: 'first_name', psex: 'sex', pbirth: 'birth_date', paddr: 'address', pphone: 'phone', pschool: 'school' };
  function check(key, v) {               /* renvoie un message d'erreur, ou '' si la valeur est bonne */
    if (key === 'school') return '';
    if (!v) return LV.t('Obligatoire', 'Obligatwa');
    if (key === 'last_name' || key === 'first_name') return v.length >= 2 && NOM_OK.test(v) ? '' : LV.t('Lettres seulement (2 au moins)', 'Lèt sèlman (omwen 2)');
    if (key === 'sex') return v === 'F' || v === 'M' ? '' : LV.t('Obligatoire', 'Obligatwa');
    if (key === 'birth_date') {
      var age = (Date.now() - new Date(v + 'T00:00:00').getTime()) / 31557600000;
      return /^\d{4}-\d{2}-\d{2}$/.test(v) && age >= 5 && age <= 120 ? '' : LV.t('Date non valable', 'Dat la pa bon');
    }
    if (key === 'address') return v.length >= 5 ? '' : LV.t('Adresse trop courte', 'Adrès la twò kout');
    if (key === 'phone') return /^[0-9]{8,15}$/.test(v) ? '' : LV.t('8 à 15 chiffres', '8 a 15 chif');
    return '';
  }
  function missing(p) {
    return ['last_name', 'first_name', 'sex', 'birth_date', 'address', 'phone'].some(function (k) { return check(k, p[k] || ''); });
  }
  function row(id, label, input) {
    return '<div class="form-row"><label for="' + id + '">' + label + '</label>' + input + '<small class="err" id="' + id + '-err"></small></div>';
  }
  function showErr(id, key, v) {
    var m = check(key, v), el = document.getElementById(id), e = document.getElementById(id + '-err');
    if (el) el.setAttribute('aria-invalid', m ? 'true' : 'false');
    if (e) e.textContent = m;
    return !m;
  }

  /* Au premier affichage, les informations du compte en ligne font foi */
  var fromAccount = false;
  function render() {
    var p = profile(), pr = LV.prefs(), acc = AUTH.cached();
    if (acc && !fromAccount) {
      fromAccount = true;
      p.name = acc.full_name; p.school = acc.school; p.role = acc.profile_type;
      ['last_name', 'first_name', 'sex', 'birth_date', 'address', 'phone'].forEach(function (k) { p[k] = acc[k] || ''; });
      saveProfile(p);
    }
    var palette = pr.palette || 'classique', mode = pr.mode || 'auto', taille = pr.taille || 'normal';
    var curMode = document.documentElement.getAttribute('data-mode');

    /* statistiques personnelles */
    var prog = APP.load();
    var done = D.resources.filter(function (r) { return prog.done[r.id]; }).length;
    var qs = Object.keys(prog.quiz).map(function (k) { return prog.quiz[k].score / prog.quiz[k].total; });
    var qavg = qs.length ? Math.round(qs.reduce(function (a, b) { return a + b; }, 0) / qs.length * 100) + ' %' : '—';
    var pdone = D.pathways.filter(function (x) { var s = APP.pathProgress(x); return s.n === s.total; }).length;
    var student = null; try { student = JSON.parse(localStorage.getItem('lv-student')); } catch (e) { /* rien */ }

    page.innerHTML =
      '<h1>' + LV.t('Mon profil', 'Pwofil mwen') + '</h1>' +
      '<p class="subtitle">' + LV.t('Vos informations, vos réglages d\'affichage et votre progression.', 'Enfòmasyon ou, reglaj afichaj ou ak pwogrè ou.') + '</p>' +
      '<div class="prof">' +

      /* --- informations --- */
      '<div class="panel"><h2>' + LV.t('Mes informations', 'Enfòmasyon mwen') + '<span class="saved" id="saved">' + LV.t('Enregistré', 'Anrejistre') + '</span></h2>' +
        (missing(p) ? '<p class="alert info show">' + LV.t('Complétez vos informations : nom, prénom, sexe, date de naissance, adresse et téléphone sont obligatoires.',
          'Konplete enfòmasyon ou : non, prenon, sèks, dat nesans, adrès ak telefòn obligatwa.') + '</p>' : '') +
        '<div class="fld-row">' +
          row('plast', LV.t('Nom', 'Non'), '<input type="text" id="plast" maxlength="60" autocomplete="family-name" data-filtre="lettres" value="' + esc(p.last_name || '') + '">') +
          row('pfirst', LV.t('Prénom', 'Prenon'), '<input type="text" id="pfirst" maxlength="60" autocomplete="given-name" data-filtre="lettres" value="' + esc(p.first_name || '') + '">') +
        '</div><div class="fld-row">' +
          row('psex', LV.t('Sexe', 'Sèks'), '<select id="psex"><option value="">' + LV.t('Choisir…', 'Chwazi…') + '</option>' +
            [['F', 'Féminin', 'Fi'], ['M', 'Masculin', 'Gason']].map(function (s) {
              return '<option value="' + s[0] + '"' + (p.sex === s[0] ? ' selected' : '') + '>' + LV.t(s[1], s[2]) + '</option>';
            }).join('') + '</select>') +
          row('pbirth', LV.t('Date de naissance', 'Dat nesans'), '<input type="date" id="pbirth" min="1900-01-01" max="' + new Date().toISOString().slice(0, 10) + '" value="' + esc(p.birth_date || '') + '">') +
        '</div>' +
        row('paddr', LV.t('Adresse', 'Adrès'), '<input type="text" id="paddr" maxlength="200" autocomplete="street-address" placeholder="' + LV.t('Rue, quartier, ville', 'Ri, katye, vil') + '" value="' + esc(p.address || '') + '">') +
        row('pphone', LV.t('Téléphone (chiffres seulement)', 'Telefòn (chif sèlman)'), '<input type="tel" id="pphone" maxlength="15" inputmode="numeric" autocomplete="tel" placeholder="50934123456" data-filtre="chiffres" value="' + esc(p.phone || '') + '">') +
        row('pschool', LV.t('Établissement (facultatif)', 'Lekòl / inivèsite (si genyen)'), '<input type="text" id="pschool" maxlength="160" value="' + esc(p.school || '') + '">') +
        '<div class="form-row"><label>' + LV.t('Je suis', 'Mwen se') + '</label><div class="roles">' +
          ROLES.map(function (r) {
            return '<label><input type="radio" name="role" value="' + r[0] + '"' + (p.role === r[0] ? ' checked' : '') + '>' + LV.t(r[1], r[2]) + '</label>';
          }).join('') + '</div></div>' +
        '<div id="rolehint" class="qs"></div>' +
        accountHtml(acc) +
      '</div>' +

      /* --- données --- */
      '<div class="panel"><h2>' + LV.t('Ma progression', 'Pwogrè mwen') + '</h2>' +
        '<div class="mine">' +
          '<div class="kpi"><div class="k">' + LV.t('Ressources terminées', 'Resous fini') + '</div><div class="v">' + done + ' / ' + D.resources.length + '</div></div>' +
          '<div class="kpi"><div class="k">' + LV.t('Parcours terminés', 'Pakou fini') + '</div><div class="v">' + pdone + ' / ' + D.pathways.length + '</div></div>' +
          '<div class="kpi"><div class="k">' + LV.t('Score moyen aux quiz', 'Nòt mwayen quiz') + '</div><div class="v">' + qavg + '</div></div>' +
        '</div>' +
        '<p class="qs">' + (student ? LV.t('Classe : ', 'Klas : ') + '<b>' + esc(student.cls.name) + '</b> · <a href="etudiant.html">' + LV.t('Ma classe', 'Klas mwen') + '</a>'
          : LV.t('Vous n\'avez pas rejoint de classe. ', 'Ou poko antre nan yon klas. ') + '<a href="etudiant.html">' + LV.t('Rejoindre une classe', 'Antre nan yon klas') + '</a>') + '</p>' +
        '<div class="btn-row"><button class="btn" id="export">' + LV.t('Exporter mes données', 'Ekspòte done mwen') + '</button>' +
        '<button class="btn danger" id="reset">' + LV.t('Effacer ma progression', 'Efase pwogrè mwen') + '</button></div>' +
      '</div>' +

      /* --- apparence --- */
      '<div class="panel full"><h2>' + LV.t('Apparence', 'Aparans') + '</h2>' +
        '<span class="opt-label">' + LV.t('Couleurs', 'Koulè') + '</span>' +
        '<div class="palettes">' + PALETTES.map(function (x) {
          var dots = Object.keys(D.domains).map(function (k) { return '<i style="background:var(--d-' + k + ')"></i>'; }).join('');
          return '<button type="button" class="pal' + (x.id === palette ? ' on' : '') + '" data-v="' + x.id + '" aria-pressed="' + (x.id === palette) + '">' +
            '<div class="pal-preview" data-palette="' + x.id + '" data-mode="' + curMode + '"><div class="bar"></div><div class="title">LabVirtyèl</div>' +
            '<div class="line"></div><div class="line" style="width:60%"></div><div class="dots">' + dots + '</div><span class="btnx">' + LV.t('Bouton', 'Bouton') + '</span></div>' +
            '<span class="pal-name">' + LV.t(x.fr, x.ht) + '<small>' + LV.t(x.dfr, x.dht) + '</small></span></button>';
        }).join('') + '</div>' +
        '<span class="opt-label">' + LV.t('Mode', 'Mòd') + '</span>' +
        seg('mode', [['auto', LV.t('Automatique', 'Otomatik')], ['clair', LV.t('Clair', 'Klè')], ['sombre', LV.t('Sombre', 'Fonse')]], mode) +
        '<span class="opt-label">' + LV.t('Taille du texte', 'Gwosè tèks la') + '</span>' +
        seg('taille', [['petit', LV.t('Petit', 'Piti')], ['normal', LV.t('Normal', 'Nòmal')], ['grand', LV.t('Grand', 'Gwo')]], taille) +
        '<span class="opt-label">' + LV.t('Langue', 'Lang') + '</span>' +
        seg('langue', [['fr', 'Français'], ['ht', 'Kreyòl']], LV.lang()) +
      '</div>' +
      '</div>';

    wire();
    roleHint();
  }

  /* Compte en ligne : adresse, rôle, déconnexion */
  function accountHtml(acc) {
    if (!acc) return '';
    var role = acc.role === 'admin' ? LV.t('Administrateur', 'Administratè') : acc.role === 'enseignant' ? LV.t('Enseignant validé', 'Pwofesè valide') : LV.t('Apprenant', 'Aprann');
    var req = acc.teacher_status === 'en_attente' ? ' · <span class="st warn">' + LV.t('Demande enseignant en attente', 'Demann pwofesè ap tann') + '</span>'
      : acc.teacher_status === 'refuse' ? ' · <span class="st bad">' + LV.t('Demande enseignant refusée', 'Demann pwofesè refize') + '</span>' : '';
    return '<div class="account-box"><div><span class="qs">' + LV.t('Compte', 'Kont') + '</span><b>' + esc(acc.email) + '</b>' +
      '<span class="qs">' + role + req + '</span></div>' +
      '<button class="btn" id="logout">' + LV.t('Se déconnecter', 'Dekonekte') + '</button></div>';
  }
  var pushTimer = null;
  function pushAccount() {
    clearTimeout(pushTimer);
    pushTimer = setTimeout(async function () {
      var acc = AUTH.cached(), p = profile();
      if (!acc || !navigator.onLine) return;
      var upd = { school: p.school || '', profile_type: p.role || acc.profile_type };
      /* seules les valeurs valables partent vers le serveur ; une valeur incomplète reste sur l'appareil */
      ['last_name', 'first_name', 'sex', 'birth_date', 'address', 'phone'].forEach(function (k) { if (!check(k, p[k] || '')) upd[k] = p[k]; });
      if (upd.first_name && upd.last_name) upd.full_name = upd.first_name + ' ' + upd.last_name;
      var r = await AUTH.client.from('profiles').update(upd).eq('id', acc.id).select().maybeSingle();
      if (r.data) { localStorage.setItem('lv-account', JSON.stringify(r.data)); }
    }, 800);
  }

  function roleHint() {
    var r = (profile().role) || '';
    var el = document.getElementById('rolehint');
    el.innerHTML = r === 'enseignant' || r === 'formateur'
      ? LV.t('Accédez à votre ', 'Ale nan ') + '<a href="enseignant.html">' + LV.t('espace enseignant', 'espas pwofesè') + '</a>.'
      : (r === 'etudiant' || r === 'eleve' ? LV.t('Rejoignez votre classe dans ', 'Antre nan klas ou nan ') + '<a href="etudiant.html">' + LV.t('Ma classe', 'Klas mwen') + '</a>.' : '');
  }

  var savedTimer = null;
  function flashSaved() {
    var s = document.getElementById('saved'); s.classList.add('on');
    clearTimeout(savedTimer); savedTimer = setTimeout(function () { s.classList.remove('on'); }, 1200);
  }

  /* Applique tout de suite les préférences à la page */
  function applyPrefs(pr) {
    var h = document.documentElement;
    h.setAttribute('data-palette', pr.palette || 'classique');
    h.setAttribute('data-taille', pr.taille || 'normal');
    var m = pr.mode || 'auto';
    var dark = m === 'sombre' || (m === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    h.setAttribute('data-mode', dark ? 'sombre' : 'clair');
  }
  function setPref(key, v) {
    var pr = LV.prefs(); pr[key] = v; LV.setPrefs(pr); applyPrefs(pr); render();
  }

  function wire() {
    Object.keys(FIELDS).forEach(function (id) {
      var el = document.getElementById(id), key = FIELDS[id];
      var p0 = profile(); if (p0[key] || key === 'school') showErr(id, key, (p0[key] || '').trim());
      el.addEventListener(el.tagName === 'SELECT' || el.type === 'date' ? 'change' : 'input', function () {
        var f = el.getAttribute('data-filtre'), v = el.value;
        if (f) {     /* lettres seulement (nom, prénom) ou chiffres seulement (téléphone) */
          var c = f === 'chiffres' ? v.replace(/[^0-9]/g, '') : v.replace(PAS_LETTRE, '');
          if (c !== v) { var pos = el.selectionStart - (v.length - c.length); el.value = c; try { el.setSelectionRange(pos, pos); } catch (e) {} }
        }
        var p = profile(); p[key] = el.value.trim();
        if (p.first_name || p.last_name) p.name = ((p.first_name || '') + ' ' + (p.last_name || '')).trim();   /* nom affiché dans « Ma classe » */
        saveProfile(p); showErr(id, key, p[key]); flashSaved(); pushAccount();
      });
    });
    page.querySelectorAll('input[name=role]').forEach(function (r) {
      r.addEventListener('change', function () { var p = profile(); p.role = r.value; saveProfile(p); flashSaved(); roleHint(); pushAccount(); });
    });
    var lo = document.getElementById('logout');
    if (lo) lo.addEventListener('click', async function () { lo.disabled = true; await AUTH.signOut(); location.replace('compte.html'); });
    page.querySelectorAll('.pal').forEach(function (b) { b.addEventListener('click', function () { setPref('palette', b.getAttribute('data-v')); }); });
    page.querySelectorAll('#mode button').forEach(function (b) { b.addEventListener('click', function () { setPref('mode', b.getAttribute('data-v')); }); });
    page.querySelectorAll('#taille button').forEach(function (b) { b.addEventListener('click', function () { setPref('taille', b.getAttribute('data-v')); }); });
    page.querySelectorAll('#langue button').forEach(function (b) { b.addEventListener('click', function () { LV.setLang(b.getAttribute('data-v')); }); });
    document.getElementById('export').addEventListener('click', function () {
      var dump = {};
      ['lv-account', 'lv-profile', 'lv-prefs', 'lv-progress', 'lv-student'].forEach(function (k) {
        try { dump[k] = JSON.parse(localStorage.getItem(k)); } catch (e) { dump[k] = null; }
      });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' }));
      a.download = 'labvirtyel-mes-donnees.json'; document.body.appendChild(a); a.click(); a.remove();
    });
    document.getElementById('reset').addEventListener('click', function () {
      if (this.dataset.confirm) { try { localStorage.removeItem('lv-progress'); } catch (e) { /* rien */ } render(); return; }
      this.dataset.confirm = '1';
      this.textContent = LV.t('Cliquez encore pour confirmer', 'Klike ankò pou konfime');
    });
  }

  LV.onLang(render);
  AUTH.ready.then(function () { render(); });
})();
</script>
</body>
</html>
